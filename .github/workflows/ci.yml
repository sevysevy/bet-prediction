name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compilation
        run: python3 -m compileall -q src

      - name: Test hors ligne des normaliseurs
        run: python3 src/feeds.py selftest

      - name: Budget de quota
        run: python3 src/feeds.py budget

      - name: Build de la page (mode demonstration)
        run: python3 src/build_site.py --demo --out /tmp/_site/index.html
