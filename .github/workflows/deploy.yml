name: build-and-deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */3 * * *"     # toutes les 3 heures
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verifier que les modules se chargent
        run: python3 -c "import sys; sys.path.insert(0,'src'); import feeds, build_site"

      - name: Test hors ligne des normaliseurs
        run: python3 src/feeds.py selftest

      - name: Generer la page
        env:
          ODDSPAPI_KEY: ${{ secrets.ODDSPAPI_KEY }}
          THEODDSAPI_KEY: ${{ secrets.THEODDSAPI_KEY }}
          PINNAPI_KEY: ${{ secrets.PINNAPI_KEY }}
        run: python3 src/build_site.py --out _site/index.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
